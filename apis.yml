aid: clerk-com
name: Clerk
description: 'Clerk is a complete user management and authentication infrastructure platform offering
  embeddable UI components, flexible APIs, and admin dashboards. It provides full-stack authentication
  including multi-factor authentication, social sign-on, passkeys, organizations for B2B SaaS, billing,
  session management, and machine-to-machine authentication, with SDKs spanning Next.js, React, Expo,
  iOS, Android, Go, Python, Ruby, Java, PHP, and C#.

  '
