openapi: 3.2.0
info:
  title: Clerk Backend Phone Numbers API
  x-logo:
    url: https://clerk.com/_next/image?url=%2Fimages%2Fclerk-logo.svg&w=96&q=75
    altText: Clerk docs
    href: https://clerk.com/docs
  contact:
    email: support@clerk.com
    name: Clerk Platform Team
    url: https://clerk.com/support
  description: 'The Clerk REST Backend API, meant to be accessed by backend servers.


    ### Versions


    When the API changes in a way that isn''t compatible with older versions, a new version is released.

    Each version is identified by its release date, e.g. `2025-04-10`. For more information, please see Clerk API Versions.


    Please see https://clerk.com/docs for more information.'
  version: '2026-08-20'
  termsOfService: https://clerk.com/terms
  license:
    name: MIT
    url: https://github.com/clerk/openapi-specs/blob/main/LICENSE
servers:
- url: https://api.clerk.com/v1
security:
- bearerAuth: []
tags:
- name: Phone Numbers
  description: A user can be associated with one or more phone numbers, which allows them to be contacted via SMS.
  externalDocs:
    url: https://clerk.com/docs/references/javascript/types/phone-number
paths:
  /phone_numbers:
    post:
      operationId: CreatePhoneNumber
      x-speakeasy-group: phoneNumbers
      x-speakeasy-name-override: create
      tags:
      - Phone Numbers
      summary: Create a phone number
      description: Create a new phone number
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: The ID representing the user
                phone_number:
                  type: string
                  description: The new phone number. Must adhere to the E.164 standard for phone number format.
                verified:
                  type:
                  - boolean
                  - 'null'
                  description: When created, the phone number will be marked as verified.
                primary:
                  type:
                  - boolean
                  - 'null'
                  description: 'Create this phone number as the primary phone number for the user. Default: false, unless it is the first phone number.'
                reserved_for_second_factor:
                  type:
                  - boolean
                  - 'null'
                  description: 'Create this phone number as reserved for multi-factor authentication. The phone number must also be verified.

                    If there are no other reserved second factors, the phone number will be set as the default second factor.'
              required:
              - user_id
              - phone_number
      responses:
        '200':
          $ref: '#/components/responses/PhoneNumber'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /phone_numbers/{phone_number_id}:
    get:
      operationId: GetPhoneNumber
      x-speakeasy-group: phoneNumbers
      x-speakeasy-name-override: get
      tags:
      - Phone Numbers
      summary: Retrieve a phone number
      description: Returns the details of a phone number
      parameters:
      - name: phone_number_id
        in: path
        description: The ID of the phone number to retrieve
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/PhoneNumber'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    delete:
      operationId: DeletePhoneNumber
      x-speakeasy-group: phoneNumbers
      x-speakeasy-name-override: delete
      tags:
      - Phone Numbers
      summary: Delete a phone number
      description: Delete the phone number with the given ID
      parameters:
      - name: phone_number_id
        in: path
        description: The ID of the phone number to delete
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/DeletedObject'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    patch:
      operationId: UpdatePhoneNumber
      x-speakeasy-group: phoneNumbers
      x-speakeasy-name-override: update
      tags:
      - Phone Numbers
      summary: Update a phone number
      description: Updates a phone number
      parameters:
      - name: phone_number_id
        in: path
        description: The ID of the phone number to update
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                verified:
                  type:
                  - boolean
                  - 'null'
                  description: The phone number will be marked as verified.
                primary:
                  type:
                  - boolean
                  - 'null'
                  description: Set this phone number as the primary phone number for the user.
                reserved_for_second_factor:
                  type:
                  - boolean
                  - 'null'
                  description: 'Set this phone number as reserved for multi-factor authentication.

                    The phone number must also be verified.

                    If there are no other reserved second factors, the phone number will be set as the default second factor.'
      responses:
        '200':
          $ref: '#/components/responses/PhoneNumber'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /phone_numbers/{phone_number_id}/prepare_verification:
    post:
      operationId: PreparePhoneNumberVerification
      x-speakeasy-group: phoneNumbers
      x-speakeasy-name-override: prepareVerification
      summary: Send a verification code to a phone number
      description: 'Sends a one-time code to the given phone number so that a backend can

        verify the user controls it (for example, in a custom, backend-driven

        sign-in flow). The code is tracked on its own verification; confirm it

        with attempt_verification.'
      tags:
      - Phone Numbers
      parameters:
      - name: phone_number_id
        in: path
        description: The ID of the phone number to send the verification code to
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/_VerificationResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/ClerkErrors'
        '500':
          $ref: '#/components/responses/ClerkErrors'
  /phone_numbers/{phone_number_id}/attempt_verification:
    post:
      operationId: AttemptPhoneNumberVerification
      x-speakeasy-group: phoneNumbers
      x-speakeasy-name-override: attemptVerification
      summary: Verify a code sent to a phone number
      description: 'Checks a one-time code against the verification identified by

        verification_id, and returns the verification with its updated status

        (`verified`, `unverified`, `expired`, or `failed`) and attempt count, so a

        backend driving its own frontend can react on every attempt — an incorrect

        or expired code is reported through the status, not as an error. Resubmitting

        a verification whose code was already accepted is rejected with a

        `verification_already_verified` error. If the code for this verification

        could not be sent (the SMS provider refused or failed the send after

        prepare_verification had returned), the attempt is rejected with a

        `verification_code_not_sent` error and no attempt is counted; call

        prepare_verification again to send a new code. If too many codes have been

        checked for this phone number recently, the attempt is rejected with a

        `verification_code_too_many_attempts` error and no attempt is counted; the

        limit is per phone number, so wait for the `Retry-After` period rather than

        sending a new code. If the code

        is correct and the phone number is not already verified, it is also marked

        as verified as a side effect (just as it would be in a frontend verification

        flow); an already verified phone number is left unchanged. It never creates

        a session; to sign the user in afterwards, mint a sign-in token.'
      tags:
      - Phone Numbers
      parameters:
      - name: phone_number_id
        in: path
        description: The ID of the phone number whose code is being verified
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                verification_id:
                  type: string
                  description: The ID of the verification to check, such as one returned by prepare_verification
                code:
                  type: string
                  description: The verification code that was sent to the phone number
              required:
              - verification_id
              - code
      responses:
        '200':
          $ref: '#/components/responses/_VerificationResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ClerkErrors'
        '429':
          $ref: '#/components/responses/ClerkErrors'
        '500':
          $ref: '#/components/responses/ClerkErrors'
  /users/{user_id}/phone_number:
    put:
      operationId: ReplaceUserPhoneNumber
      x-speakeasy-group: phoneNumbers
      x-speakeasy-name-override: replaceForUser
      tags:
      - Phone Numbers
      summary: Replace a user's phone number
      description: 'Replaces all of the user''s phone numbers with a single primary phone number.

        By default the new phone number is created verified, with the admin verification strategy.

        When `identification_status` is `reserved` it is created reserved instead: unverified but usable

        for sign-in and locked so no other user can claim it. When it is `unverified` the phone number is

        neither usable for sign-in nor locked. The new phone number is never reserved for

        second factor. Any existing phone numbers are deleted; replacing a phone number that is reserved

        for second factor disables the user''s MFA.


        **Warning:** `identification_status: unverified` can lock the user out of their account. An

        unverified phone number cannot be used to sign in, so if the user has no other verified or

        reserved identifier, deleting their existing phone numbers leaves them unable to authenticate —

        and unable to verify the new number, since that requires signing in. Recovery then requires

        another admin API call.'
      parameters:
      - name: user_id
        in: path
        description: The ID of the user whose phone number to replace
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                phone_number:
                  type: string
                  description: The new phone number. Must adhere to the E.164 standard for phone number format.
                identification_status:
                  type: string
                  enum:
                  - verified
                  - reserved
                  - unverified
                  default: verified
                  description: 'Controls the status of the replacement phone number. Defaults to `verified`. Set to

                    `reserved` to create it reserved (unverified but usable for sign-in and locked so no

                    other user can claim it), or to `unverified` to create it neither usable for sign-in

                    nor locked.


                    **Warning:** `unverified` can lock the user out of their account. An unverified phone

                    number cannot be used to sign in, so if the user has no other verified or reserved

                    identifier, they will be unable to authenticate and unable to verify this number.

                    Prefer `reserved` unless you specifically need the number left unclaimed — for

                    example so that another user can also hold it until one of them verifies it.'
              required:
              - phone_number
      responses:
        '200':
          $ref: '#/components/responses/PhoneNumber'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  responses:
    ResourceNotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClerkErrors'
    PhoneNumber:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PhoneNumber'
    AuthorizationInvalid:
      description: Authorization invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClerkErrors'
    DeletedObject:
      description: Deleted Object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeletedObject'
    ClerkErrors:
      description: Request was not successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClerkErrors'
    _VerificationResponse:
      description: 'The verification. After prepare_verification it is pending (unverified);

        after attempt_verification its status reflects the attempt outcome.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              object:
                type: string
                description: The type of the verification object.
              id:
                type: string
                description: The ID of the verification. Pass this to attempt_verification.
              status:
                type: string
                description: The status of the verification (unverified, verified, expired, or failed).
              strategy:
                type: string
                description: The verification strategy (email_code or phone_code).
              attempts:
                type:
                - integer
                - 'null'
                description: The number of attempts made against this verification.
              expire_at:
                type:
                - integer
                - 'null'
                format: int64
                description: Unix timestamp (milliseconds) at which the code expires.
              channel:
                type:
                - string
                - 'null'
                description: The channel the code was sent over (phone numbers only).
    UnprocessableEntity:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClerkErrors'
    AuthenticationInvalid:
      description: Authentication invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClerkErrors'
  schemas:
    PhoneNumber:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        object:
          type: string
          description: 'String representing the object''s type. Objects of the same type share the same value.

            '
          enum:
          - phone_number
        phone_number:
          type: string
        reserved_for_second_factor:
          type: boolean
        default_second_factor:
          type: boolean
        reserved:
          type: boolean
        verification:
          type:
          - object
          - 'null'
          oneOf:
          - $ref: '#/components/schemas/verification_otp'
          - $ref: '#/components/schemas/verification_admin'
          discriminator:
            propertyName: object
            mapping:
              verification_otp: '#/components/schemas/verification_otp'
              verification_admin: '#/components/schemas/verification_admin'
        linked_to:
          type: array
          items:
            $ref: '#/components/schemas/IdentificationLink'
        backup_codes:
          type:
          - array
          - 'null'
          items:
            type: string
        created_at:
          type: integer
          format: int64
          description: 'Unix timestamp of creation

            '
        updated_at:
          type: integer
          format: int64
          description: 'Unix timestamp of creation

            '
      required:
      - object
      - phone_number
      - verification
      - linked_to
      - reserved
      - created_at
      - updated_at
    ClerkErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ClerkError'
        meta:
          type: object
          additionalProperties: true
        clerk_trace_id:
          type: string
      required:
      - errors
    verification_otp:
      x-speakeasy-name-override: OTP
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
          - verification_otp
        status:
          type: string
          enum:
          - unverified
          - verified
          - failed
          - expired
        strategy:
          x-speakeasy-unknown-values: allow
          type: string
          enum:
          - phone_code
          - email_code
          - reset_password_email_code
        attempts:
          type:
          - integer
          - 'null'
        expire_at:
          type:
          - integer
          - 'null'
        channel:
          type:
          - string
          - 'null'
          description: The delivery channel of the code (phone codes only).
        verified_at_client:
          type:
          - string
          - 'null'
      required:
      - status
      - strategy
      - attempts
      - expire_at
    verification_admin:
      x-speakeasy-name-override: Admin
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
          - verification_admin
        status:
          type: string
          enum:
          - verified
        strategy:
          x-speakeasy-unknown-values: allow
          type: string
          enum:
          - admin
        attempts:
          type:
          - integer
          - 'null'
        expire_at:
          type:
          - integer
          - 'null'
        verified_at_client:
          type:
          - string
          - 'null'
      required:
      - status
      - strategy
      - attempts
      - expire_at
    DeletedObject:
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
        id:
          type: string
        slug:
          type: string
        deleted:
          type: boolean
        external_id:
          type: string
      required:
      - object
      - deleted
    ClerkError:
      type: object
      properties:
        message:
          type: string
        long_message:
          type: string
        code:
          type: string
        meta:
          type: object
          additionalProperties: true
      required:
      - message
      - long_message
      - code
    IdentificationLink:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          pattern: ^oauth_[a-z]+$
        id:
          type: string
      required:
      - type
      - id
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Secret key, obtained under "API Keys" in the Clerk Dashboard.
      bearerFormat: sk_<environment>_<secret value>
externalDocs:
  url: https://clerk.com/docs
x-speakeasy-retries:
  strategy: backoff
  backoff:
    initialInterval: 500
    maxInterval: 60000
    maxElapsedTime: 3600000
    exponent: 1.5
  statusCodes:
  - 5XX
  retryConnectionErrors: true
x-provenance:
  method: harvested
  publisher: Clerk
  source: https://clerk.com/docs/reference/spec/bapi/latest.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
