          type: string
        long_message:
          type: string
        code:
          type: string
        meta:
          type: object
          additionalProperties: true
      required:
      - message
      - long_message
      - code
    BillingPaymentAttempt:
      type: object
      additionalProperties: false
      required:
      - object
      - id
      - payment_id
      - instance_id
      - charge_type
      - payee_id
      - payee
      - payer_id
      - payer
      - amount
      - payment_method_id
      - payment_method
      - statement_id
      - gateway_external_id
      - gateway_external_url
      - status
      - paid_at
      - failed_at
      - created_at
      - updated_at
      properties:
        object:
          type: string
          description: String representing the object's type. Objects of the same type share the same value.
          enum:
          - commerce_payment
        id:
          type: string
          description: Unique identifier for the payment attempt.
        payment_id:
          type: string
          description: Unique identifier for the associated payment.
        instance_id:
          type: string
          description: The ID of the instance this payment attempt belongs to.
        charge_type:
          type: string
          description: Type of charge for this payment attempt.
        payee_id:
          type: string
          description: Unique identifier for the payee.
        payee:
          type: object
          description: The payee associated with this payment attempt.
        payer_id:
          type: string
          description: Unique identifier for the payer.
        payer:
          $ref: '#/components/schemas/CommercePayerResponse'
          description: The payer associated with this payment attempt.
        subscription_item_id:
          type: string
          description: Unique identifier for the associated subscription item.
        subscription_item:
          type: object
          description: The subscription item associated with this payment attempt.
        amount:
          $ref: '#/components/schemas/CommerceMoneyResponse'
          description: The amount for this payment attempt.
        totals:
          allOf:
          - $ref: '#/components/schemas/CommerceTotalsResponse-2'
          description: Totals breakdown for this payment attempt.
        payment_method_id:
          type: string
          description: Unique identifier for the payment method.
        payment_method:
          $ref: '#/components/schemas/CommercePaymentMethodResponse'
          description: The payment method used for this payment attempt.
        statement_id:
          type: string
          description: Unique identifier for the associated statement.
        gateway_external_id:
          type:
          - string
          - 'null'
          description: External identifier from the payment gateway.
        gateway_external_url:
          type:
          - string
          - 'null'
          description: External URL from the payment gateway.
        status:
          type: string
          description: The current status of the payment attempt.
          enum:
          - pending
          - paid
          - failed
        paid_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Unix timestamp (in milliseconds) when the payment was completed.
        failed_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Unix timestamp (in milliseconds) when the payment failed to be processed.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (in milliseconds) when the payment attempt was created.
        updated_at:
          type: integer
          format: int64
          description: Unix timestamp (in milliseconds) when the payment attempt was last updated.
    CommerceTotalsResponse-2:
      type: object
      additionalProperties: false
      properties:
        subtotal:
          $ref: '#/components/schemas/CommerceMoneyResponse'
        base_fee:
          $ref: '#/components/schemas/CommerceMoneyResponse'
        tax_total:
          $ref: '#/components/schemas/CommerceMoneyResponse'
        grand_total:
          $ref: '#/components/schemas/CommerceMoneyResponse'
        per_unit_totals:
          type: array
          items:
            $ref: '#/components/schemas/CommercePerUnitTotal-2'
        credits:
          allOf:
          - $ref: '#/components/schemas/CommerceCreditsResponse'
        discounts:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/BillingDiscountsResponse'
          description: Information about the discounts applied to the payment
      required:
      - subtotal
      - base_fee
      - tax_total
      - grand_total
    AdjustCreditBalanceRequest:
      type: object
      additionalProperties: false
      required:
      - amount
      - action
      - idempotency_key
      properties:
        amount:
          type: integer
          format: int64
          description: The credit amount in cents. Must be greater than zero.
        action:
          type: string
          enum:
          - increase
          - decrease
          description: Whether to increase or decrease the credit balance.
        currency:
          type: string
          description: The currency code (e.g. "USD"). Defaults to USD if not provided.
        idempotency_key:
          type: string
          description: A unique key to ensure the adjustment is applied only once. Repeated requests with the same key return the original ledger entry.
        note:
          type: string
          description: An optional note to attach to the ledger entry.
    ClerkErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ClerkError'
        meta:
          type: object
          additionalProperties: true
        clerk_trace_id:
          type: string
      required:
      - errors
    BillingProrationDiscountDetail:
      type: object
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/CommerceMoneyResponse'
          description: Credit amount with formatting
        cycle_days_passed:
          type: integer
          format: int64
          description: Number of days that have passed in the billing cycle
        cycle_days_total:
          type: integer
          format: int64
          description: Total number of days in the billing cycle
        cycle_passed_percent:
          type: number
          format: double
          description: Percentage of the billing cycle that has passed
      required:
      - amount
      - cycle_days_passed
      - cycle_days_total
      - cycle_passed_percent
    CommercePerUnitTotal-2:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Name of the billable unit (for example, seats)
        block_size:
          type: integer
          format: int64
          description: Number of units included in each pricing block
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/CommercePerUnitTotalTier-2'
          description: Computed totals for each pricing tier
      required:
      - name
      - block_size
      - tiers
    CommercePayerCreditResponse:
      type: object
      additionalProperties: false
      required:
      - remaining_balance
      - applied_amount
      properties:
        remaining_balance:
          $ref: '#/components/schemas/CommerceMoneyResponse'
        applied_amount:
          $ref: '#/components/schemas/CommerceMoneyResponse'
    CommerceTotalsResponse:
      type: object
      additionalProperties: false
      required:
      - subtotal
      - base_fee
      - tax_total
      - grand_total
      properties:
        subtotal:
          $ref: '#/components/schemas/CommerceMoneyResponse'
        base_fee:
          $ref: '#/components/schemas/CommerceMoneyResponse'
        tax_total:
          $ref: '#/components/schemas/CommerceMoneyResponse'
        grand_total:
          $ref: '#/components/schemas/CommerceMoneyResponse'
        per_unit_totals:
          type: array
          items:
            $ref: '#/components/schemas/CommercePerUnitTotal'
        credits:
          allOf:
          - $ref: '#/components/schemas/CommerceCreditsResponse'
        discounts:
          allOf:
          - $ref: '#/components/schemas/CommerceDiscountsResponse'
    CommerceSubscriptionItemSeatsResponse:
      type: object
      additionalProperties: false
      properties:
        quantity:
          type:
          - integer
          - 'null'
          format: int64
          description: Seat quantity being billed; null means unlimited
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/CommercePerUnitTotalTier-2'
          description: Per-unit cost breakdown by pricing tier
      required:
      - quantity
    CommerceSubscriptionCreditResponse:
      type: object
      additionalProperties: false
      properties:
        amount:
          allOf:
          - $ref: '#/components/schemas/CommerceMoneyResponse'
          description: Credit amount.
        cycle_remaining_percent:
          type: number
          format: float
          description: Percentage of the billing cycle remaining.
    CommercePerUnitTotalTier:
      type: object
      additionalProperties: false
      required:
      - fee_per_block
      - total
      properties:
        quantity:
          type:
          - integer
          - 'null'
          format: int64
          description: Units billed in this tier; null means unlimited.
        fee_per_block:
          $ref: '#/components/schemas/CommerceMoneyResponse'
          description: Price charged per block in this tier.
        total:
          $ref: '#/components/schemas/CommerceMoneyResponse'
          description: Total charge for this tier.
    CommercePriceTransitionDetails:
      type: object
      additionalProperties: false
      required:
      - previous_plan
      - previous_price
      - effective_at
      - effective_mode
      - charged_immediately
      - previous_subscription_item_status
      - previous_subscription_item_id
      properties:
        previous_plan:
          $ref: '#/components/schemas/CommercePlan-2'
        previous_price:
          $ref: '#/components/schemas/BillingPriceResponse'
        effective_at:
          type: integer
          format: int64
          description: Unix timestamp (milliseconds) when the new price takes effect.
        effective_mode:
          type: string
          description: When the new price takes effect.
          enum:
          - immediate
          - end_of_period
        next_billing_date:
          type:
          - integer
          - 'null'
          format: int64
          description: Unix timestamp (milliseconds) for the next billing date.
        charged_immediately:
          type: boolean
          description: Whether an immediate charge was made.
        immediate_charge:
          allOf:
          - $ref: '#/components/schemas/CommerceMoneyResponse'
          description: Amount charged immediately, if any.
        previous_subscription_item_status:
          type: string
          description: The status of the previous subscription item after transition.
          enum:
          - canceled
          - ended
          - abandoned
        previous_subscription_item_id:
          type: string
          description: The ID of the previous subscription item.
    PaginatedCommercePlanResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - total_count
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommercePlan'
          description: Array of plans.
        total_count:
          type: integer
          format: int64
          description: Total number of plans.
    ExtendFreeTrialRequest:
      type: object
      additionalProperties: false
      required:
      - extend_to
      properties:
        extend_to:
          type: string
          format: date-time
          description: 'RFC3339 timestamp to extend the free trial to.

            Must be in the future and not more than 365 days from now.'
          example: '2026-01-08T00:00:00Z'
    BillingDiscountsResponse:
      type: object
      additionalProperties: false
      properties:
        proration:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/BillingProrationDiscountDetail'
          description: Proration details from passed subscription time
        total:
          $ref: '#/components/schemas/CommerceMoneyResponse'
          description: Total discounts applied
      required:
      - proration
      - total
    CommercePlanUnitPriceTier:
      type: object
      additionalProperties: false
      properties:
        starts_at_block:
          type: integer
          format: int64
          description: Start block (inclusive) for this tier
        ends_after_block:
          type:
          - integer
          - 'null'
          format: int64
          description: End block (inclusive) for this tier; null means unlimited
        fee_per_block:
          $ref: '#/components/schemas/CommerceMoneyResponse'
          description: Price charged per block in this tier
      required:
      - starts_at_block
      - fee_per_block
    CommerceCreditLedgerResponse:
      type: object
      additionalProperties: false
      required:
      - object
      - id
      - payer_id
      - amount
      - source_type
      - source_id
      - created_at
      properties:
        object:
          type: string
          description: String representing the object's type. Always "commerce_credit_ledger".
        id:
          type: string
          description: Unique identifier for the ledger entry.
        payer_id:
          type: string
          description: The ID of the payer whose balance was adjusted.
        amount:
          $ref: '#/components/schemas/CommerceMoneyResponse'
          description: The credit amount with formatting. Positive for increases, negative for decreases.
        source_type:
          type: string
          description: The type of source that originated the adjustment (e.g. "grant").
        source_id:
          type: string
          description: The ID of the source that originated the adjustment.
        note:
          type:
          - string
          - 'null'
          description: An optional note attached to the ledger entry.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the ledger entry was created.
    ApplyCommerceDiscountRequest:
      type: object
      additionalProperties: false
      required:
      - discount_id
      properties:
        discount_id:
          type: string
          description: The ID of the discount to apply to the subscription item.
    FeatureResponse-2:
      type: object
      additionalProperties: false
      required:
      - object
      - id
      - name
      - description
      - slug
      - avatar_url
      properties:
        object:
          type: string
          description: String representing the object's type. Objects of the same type share the same value.
          enum:
          - feature
        id:
          type: string
          description: Unique identifier for the feature.
        name:
          type: string
          description: The name of the feature.
        description:
          type: string
          description: The description of the feature.
        slug:
          type: string
          description: The URL-friendly slug for the feature.
        avatar_url:
          type: string
          description: The URL of the feature's avatar image.
    CommerceDiscountRedemptionResponse:
      type: object
      additionalProperties: false
      required:
      - object
      - id
      - subscription_item_id
      - discount_id
      - source
      - cycles_applied
      - cycles_remaining
      - redeemed_at
      - redeemed_by
      properties:
        object:
          type: string
          description: String representing the object's type. Objects of the same type share the same value.
          enum:
          - commerce_discount_redemption
        id:
          type: string
          description: Unique identifier for the discount redemption.
        subscription_item_id:
          type: string
          description: Unique identifier for the subscription item the discount was applied to.
        discount_id:
          type: string
          description: Unique identifier for the discount that was applied.
        name:
          type: string
          description: The display name of the discount.
        source:
          type: string
          description: How the discount was applied to the subscription item.
          enum:
          - promotion
          - manual
          - promo_code
        promo_code:
          type: string
          description: The promo code used to redeem the discount, when applicable.
        effect:
          type: string
          description: The snapshotted discount effect.
          enum:
          - percentage
          - fixed_amount
        percent_off:
          type:
          - number
          - 'null'
          format: double
          description: Percent off when the effect is percentage.
        amount_off:
          allOf:
          - $ref: '#/components/schemas/CommerceMoneyResponse'
          description: Fixed amount off when the effect is fixed_amount.
        amount:
          allOf:
          - $ref: '#/components/schemas/CommerceMoneyResponse'
          description: 'How much this discount takes off the subscription item''s next renewal charge.

            Present for either effect when next-payment data is available.'
        cycles_remaining:
          type:
          - integer
          - 'null'
          format: int32
          description: Remaining billing cycles the discount applies to. Null means the discount lasts forever.
        cycles_applied:
          type: integer
          format: int32
          description: Number of billing cycles the discount has already been applied to.
        status:
          type: string
          description: Current status of the discount redemption.
          enum:
          - active
          - exhausted
          - removed
        redeemed_at:
          type: integer
          format: int64
          description: Unix timestamp (in milliseconds) when the discount was redeemed.
        redeemed_by:
          type:
          - string
          - 'null'
          description: Identifier of the actor that redeemed the discount, when available.
    CommerceCreditBalanceResponse:
      type: object
      additionalProperties: false
      required:
      - object
      - balance
      properties:
        object:
          type: string
          description: String representing the object's type. Always "commerce_credit_balance".
        balance:
          allOf:
          - $ref: '#/components/schemas/CommerceMoneyResponse'
          description: The current credit balance. Null when the payer has never had credits.
    BillingStatement:
      type: object
      additionalProperties: false
      required:
      - object
      - id
      - instance_id
      - timestamp
      - payer
      - status
      - totals
      - groups
      properties:
        object:
          type: string
          description: String representing the object's type. Objects of the same type share the same value.
          enum:
          - commerce_statement
        id:
          type: string
          description: Unique identifier for the billing statement.
        instance_id:
          type: string
          description: The ID of the instance this statement belongs to.
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp (in milliseconds) when the statement was created.
        payer:
          $ref: '#/components/schemas/CommercePayerResponse'
          description: The payer associated with this statement.
        status:
          type: string
          description: The current status of the statement.
          enum:
          - open
          - closed
        totals:
          type: object
          description: Totals for the statement.
          required:
          - grand_total
          - subtotal
          - base_fee
          - tax_total
          properties:
            grand_total:
              $ref: '#/components/schemas/CommerceMoneyResponse'
              description: The grand total amount for the statement.
            subtotal:
              $ref: '#/components/schemas/CommerceMoneyResponse'
              description: The subtotal amount for the statement (base fee + unit price totals).
            base_fee:
              $ref: '#/components/schemas/CommerceMoneyResponse'
              description: The base plan fee before unit pricing.
            tax_total:
              $ref: '#/components/schemas/CommerceMoneyResponse'
              description: The tax total amount for the statement.
        groups:
          type: array
          description: Array of statement groups.
          items:
            type: object
            description: A statement group.
            required:
            - object
            - timestamp
            - items
            properties:
              object:
                type: string
                description: String representing the object's type. Objects of the same type share the same value.
                enum:
                - commerce_statement_group
              timestamp:
                type: integer
                format: int64
                description: Unix timestamp (in milliseconds) of the date the group's payment attempts were created
              items:
                type: array
                items:
                  $ref: '#/components/schemas/BillingPaymentAttempt'
                description: The payment attempts included in the group
    CreateBillingPriceRequest:
      type: object
      additionalProperties: false
      required:
      - plan_id
      - amount
      properties:
        plan_id:
          type: string
          description: The ID of the plan this price belongs to.
        currency:
          type: string
          description: The currency code (e.g., "USD"). Defaults to USD.
          default: USD
        amount:
          type:
          - integer
          - 'null'
          format: int64
          description: The monthly amount in cents. Use `0` for a complimentary price. Positive amounts must be at least $1 (100 cents).
        annual_monthly_amount:
          type:
          - integer
          - 'null'
          format: int64
          description: The monthly amount in cents when billed annually. Use `0` for a complimentary price. Positive amounts must be at least $1 (100 cents).
        description:
          type: string
          description: An optional description for this custom price.
        supported_billing_periods:
          type: string
          description: Which billing periods this price supports. Inferred from amounts if omitted.
          enum:
          - month
          - annual
          - both
    CommerceProrationCreditDetailResponse:
      type: object
      additionalProperties: false
      required:
      - amount
      - cycle_days_remaining
      - cycle_days_total
      - cycle_remaining_percent
      properties:
        amount:
          $ref: '#/components/schemas/CommerceMoneyResponse'
        cycle_days_remaining:
          type: integer
          format: int64
        cycle_days_total:
          type: integer
          format: int64
        cycle_remaining_percent:
          type: number
          format: double
    CommerceCreditsResponse:
      type: object
      additionalProperties: false
      properties:
        proration:
          allOf:
          - $ref: '#/components/schemas/CommerceProrationCreditDetailResponse'
        payer:
          allOf:
          - $ref: '#/components/schemas/CommercePayerCreditResponse'
        total:
          $ref: '#/components/schemas/CommerceMoneyResponse'
      required:
      - proration
      - payer
      - total
    PaginatedBillingPriceResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - total_count
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillingPriceResponse'
          description: Array of prices.
        total_count:
          type: integer
          format: int64
          description: Total number of prices.
    CommerceSubscriptionItemNextPaymentResponse:
      type: object
      additionalProperties: false
      properties:
        amount:
          allOf:
          - $ref: '#/components/schemas/CommerceMoneyResponse'
          description: Base plan fee for the next payment. Does not include per-unit (e.g. seat) charges; see `totals.grand_total` for the full amount.
        date:
          type:
          - integer
          - 'null'
          format: int64
          description: Unix timestamp (in milliseconds) for the next payment date.
        per_unit_totals:
          type: array
          items:
            $ref: '#/components/schemas/CommercePerUnitTotal'
          description: Per-unit total breakdown (for example, seats) for the next payment.
        totals:
          allOf:
          - $ref: '#/components/schemas/CommerceTotalsResponse'
          description: Breakdown of the recurring amount that will be billed at renewal (base fee + per-unit charges). Tax and credits are not previewed.
    CommerceProrationDiscountResponse:
      type: object
      additionalProperties: false
      required:
      - amount
      - cycle_days_passed
      - cycle_days_total
      - cycle_passed_percent
      properties:
        amount:
          $ref: '#/components/schemas/CommerceMoneyResponse'
        cycle_days_passed:
          type: integer
          format: int64
        cycle_days_total:
          type: integer
          format: int64
        cycle_passed_percent:
          type: number
          format: float
    CommerceDiscountsResponse:
      type: object
      additionalProperties: false
      required:
      - proration
      - total
      properties:
        proration:
          allOf:
          - $ref: '#/components/schemas/CommerceProrationDiscountResponse'
        total:
          $ref: '#/components/schemas/CommerceMoneyResponse'
  responses:
    BillingPrice:
      description: A billing price.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingPriceResponse'
    ResourceNotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClerkErrors'
    CommerceSubscriptionItem.List:
      description: A list of commerce subscription items.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedCommerceSubscriptionItemResponse'
    UnprocessableEntity:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClerkErrors'
    CommerceSubscription:
      description: A commerce subscription.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommerceSubscription'
    CommerceSubscriptionItem:
      description: A commerce subscription item.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommerceSubscriptionItem'
    BillingPaymentAttempt.List:
      description: A list of billing payment attempts.
      content:
