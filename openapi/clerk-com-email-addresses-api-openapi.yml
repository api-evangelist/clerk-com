openapi: 3.2.0
info:
  title: Clerk Backend Email Addresses API
  x-logo:
    url: https://clerk.com/_next/image?url=%2Fimages%2Fclerk-logo.svg&w=96&q=75
    altText: Clerk docs
    href: https://clerk.com/docs
  contact:
    email: support@clerk.com
    name: Clerk Platform Team
    url: https://clerk.com/support
  description: 'The Clerk REST Backend API, meant to be accessed by backend servers.


    ### Versions


    When the API changes in a way that isn''t compatible with older versions, a new version is released.

    Each version is identified by its release date, e.g. `2025-04-10`. For more information, please see Clerk API Versions.


    Please see https://clerk.com/docs for more information.'
  version: '2026-08-20'
  termsOfService: https://clerk.com/terms
  license:
    name: MIT
    url: https://github.com/clerk/openapi-specs/blob/main/LICENSE
servers:
- url: https://api.clerk.com/v1
security:
- bearerAuth: []
tags:
- name: Email Addresses
  description: A user can be associated with one or more email addresses, which allows them to be contacted via email.
  externalDocs:
    url: https://clerk.com/docs/references/javascript/types/email-address
paths:
  /email_addresses:
    post:
      operationId: CreateEmailAddress
      x-speakeasy-group: emailAddresses
      x-speakeasy-name-override: create
      tags:
      - Email Addresses
      summary: Create an email address
      description: Create a new email address
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: The ID representing the user
                email_address:
                  type: string
                  description: The new email address. Must adhere to the RFC 5322 specification for email address format.
                verified:
                  type:
                  - boolean
                  - 'null'
                  description: When created, the email address will be marked as verified.
                primary:
                  type:
                  - boolean
                  - 'null'
                  description: 'Create this email address as the primary email address for the user.

                    Default: false, unless it is the first email address.'
                notify_primary_email_address_changed:
                  type:
                  - boolean
                  - 'null'
                  description: 'If set to `true` and the email address is created as the user''s new primary,

                    the previous primary email address is notified of the change.

                    By default, no notification is sent.'
                  default: false
              required:
              - user_id
              - email_address
      responses:
        '200':
          $ref: '#/components/responses/EmailAddress'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /email_addresses/{email_address_id}:
    get:
      operationId: GetEmailAddress
      x-speakeasy-group: emailAddresses
      x-speakeasy-name-override: get
      x-speakeasy-usage-example: true
      tags:
      - Email Addresses
      summary: Retrieve an email address
      description: Returns the details of an email address.
      parameters:
      - name: email_address_id
        in: path
        description: The ID of the email address to retrieve
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/EmailAddress'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    delete:
      operationId: DeleteEmailAddress
      x-speakeasy-group: emailAddresses
      x-speakeasy-name-override: delete
      tags:
      - Email Addresses
      summary: Delete an email address
      description: Delete the email address with the given ID
      parameters:
      - name: email_address_id
        in: path
        description: The ID of the email address to delete
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/DeletedObject'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      operationId: UpdateEmailAddress
      x-speakeasy-group: emailAddresses
      x-speakeasy-name-override: update
      tags:
      - Email Addresses
      summary: Update an email address
      description: Updates an email address.
      parameters:
      - name: email_address_id
        in: path
        description: The ID of the email address to update
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                verified:
                  type:
                  - boolean
                  - 'null'
                  description: The email address will be marked as verified.
                primary:
                  type:
                  - boolean
                  - 'null'
                  description: Set this email address as the primary email address for the user.
                notify_primary_email_address_changed:
                  type:
                  - boolean
                  - 'null'
                  description: 'If set to `true` and this update makes the email address the user''s new primary,

                    the previous primary email address is notified of the change.

                    By default, no notification is sent.'
                  default: false
      responses:
        '200':
          $ref: '#/components/responses/EmailAddress'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /email_addresses/{email_address_id}/prepare_verification:
    post:
      operationId: PrepareEmailAddressVerification
      x-speakeasy-group: emailAddresses
      x-speakeasy-name-override: prepareVerification
      summary: Send a verification code to an email address
      description: 'Sends a one-time code to the given email address so that a backend can

        verify the user controls it (for example, in a custom, backend-driven

        sign-in flow). The code is tracked on its own verification; confirm it

        with attempt_verification.'
      tags:
      - Email Addresses
      parameters:
      - name: email_address_id
        in: path
        description: The ID of the email address to send the verification code to
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/_VerificationResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/ClerkErrors'
        '500':
          $ref: '#/components/responses/ClerkErrors'
  /email_addresses/{email_address_id}/attempt_verification:
    post:
      operationId: AttemptEmailAddressVerification
      x-speakeasy-group: emailAddresses
      x-speakeasy-name-override: attemptVerification
      summary: Verify a code sent to an email address
      description: 'Checks a one-time code against the verification identified by

        verification_id, and returns the verification with its updated status

        (`verified`, `unverified`, `expired`, or `failed`) and attempt count, so a

        backend driving its own frontend can react on every attempt — an incorrect

        or expired code is reported through the status, not as an error. Resubmitting

        a verification whose code was already accepted is rejected with a

        `verification_already_verified` error. If the code

        is correct and the email address is not already verified, it is also marked

        as verified as a side effect (just as it would be in a frontend verification

        flow); an already verified email address is left unchanged. It never creates

        a session; to sign the user in afterwards, mint a sign-in token.'
      tags:
      - Email Addresses
      parameters:
      - name: email_address_id
        in: path
        description: The ID of the email address whose code is being verified
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                verification_id:
                  type: string
                  description: The ID of the verification to check, such as one returned by prepare_verification
                code:
                  type: string
                  description: The verification code that was sent to the email address
              required:
              - verification_id
              - code
      responses:
        '200':
          $ref: '#/components/responses/_VerificationResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/ClerkErrors'
  /users/{user_id}/email_address:
    put:
      operationId: ReplaceUserEmailAddress
      x-speakeasy-group: emailAddresses
      x-speakeasy-name-override: replaceForUser
      tags:
      - Email Addresses
      summary: Replace a user's email address
      description: 'Replaces all of the user''s email addresses with a single primary email address.

        By default the new email address is created verified, with the admin verification strategy.

        When `identification_status` is `reserved` it is created reserved instead: unverified but usable

        for sign-in and locked so no other user can claim it. When it is `unverified` the address is

        neither usable for sign-in nor locked. Any existing email addresses are deleted.

        If an existing email address is linked to a connected account, the request is rejected; remove

        the connected account first.


        **Warning:** `identification_status: unverified` can lock the user out of their account. An

        unverified email address cannot be used to sign in, so if the user has no other verified or

        reserved identifier, deleting their existing email addresses leaves them unable to

        authenticate — and unable to verify the new address, since that requires signing in. Recovery

        then requires another admin API call.'
      parameters:
      - name: user_id
        in: path
        description: The ID of the user whose email address to replace
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email_address:
                  type: string
                  description: The new email address. Must adhere to the RFC 5322 specification for email address format.
                identification_status:
                  type: string
                  enum:
                  - verified
                  - reserved
                  - unverified
                  default: verified
                  description: 'Controls the status of the replacement email address. Defaults to `verified`. Set to

                    `reserved` to create it reserved (unverified but usable for sign-in and locked so no

                    other user can claim it), or to `unverified` to create it neither usable for sign-in

                    nor locked.


                    **Warning:** `unverified` can lock the user out of their account. An unverified email

                    address cannot be used to sign in, so if the user has no other verified or reserved

                    identifier, they will be unable to authenticate and unable to verify this address.

                    Prefer `reserved` unless you specifically need the address left unclaimed — for

                    example so that another user can also hold it until one of them verifies it.'
                notify_primary_email_address_changed:
                  type:
                  - boolean
                  - 'null'
                  description: 'If set to `true`, the user''s previous primary email address is notified that the

                    primary email address has changed. No notification is sent when the replacement

                    is the user''s current primary email address. By default, no notification is sent.'
                  default: false
              required:
              - email_address
      responses:
        '200':
          $ref: '#/components/responses/EmailAddress'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  responses:
    ResourceNotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClerkErrors'
    _VerificationResponse:
      description: 'The verification. After prepare_verification it is pending (unverified);

        after attempt_verification its status reflects the attempt outcome.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              object:
                type: string
                description: The type of the verification object.
              id:
                type: string
                description: The ID of the verification. Pass this to attempt_verification.
              status:
                type: string
                description: The status of the verification (unverified, verified, expired, or failed).
              strategy:
                type: string
                description: The verification strategy (email_code or phone_code).
              attempts:
                type:
                - integer
                - 'null'
                description: The number of attempts made against this verification.
              expire_at:
                type:
                - integer
                - 'null'
                format: int64
                description: Unix timestamp (milliseconds) at which the code expires.
              channel:
                type:
                - string
                - 'null'
                description: The channel the code was sent over (phone numbers only).
    UnprocessableEntity:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClerkErrors'
    ClerkErrors:
      description: Request was not successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClerkErrors'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClerkErrors'
    AuthorizationInvalid:
      description: Authorization invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClerkErrors'
    DeletedObject:
      description: Deleted Object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeletedObject'
    EmailAddress:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailAddress'
    AuthenticationInvalid:
      description: Authentication invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClerkErrors'
  schemas:
    IdentificationLink:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          pattern: ^oauth_[a-z]+$
        id:
          type: string
      required:
      - type
      - id
    verification_email_link:
      x-speakeasy-name-override: EmailLink
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
          - verification_email_link
        status:
          type: string
          enum:
          - unverified
          - verified
          - failed
          - expired
        strategy:
          type: string
          enum:
          - email_link
        attempts:
          type:
          - integer
          - 'null'
        expire_at:
          type:
          - integer
          - 'null'
        verified_at_client:
          type:
          - string
          - 'null'
      required:
      - status
      - strategy
      - attempts
      - expire_at
    verification_otp:
      x-speakeasy-name-override: OTP
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
          - verification_otp
        status:
          type: string
          enum:
          - unverified
          - verified
          - failed
          - expired
        strategy:
          x-speakeasy-unknown-values: allow
          type: string
          enum:
          - phone_code
          - email_code
          - reset_password_email_code
        attempts:
          type:
          - integer
          - 'null'
        expire_at:
          type:
          - integer
          - 'null'
        channel:
          type:
          - string
          - 'null'
          description: The delivery channel of the code (phone codes only).
        verified_at_client:
          type:
          - string
          - 'null'
      required:
      - status
      - strategy
      - attempts
      - expire_at
    verification_admin:
      x-speakeasy-name-override: Admin
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
          - verification_admin
        status:
          type: string
          enum:
          - verified
        strategy:
          x-speakeasy-unknown-values: allow
          type: string
          enum:
          - admin
        attempts:
          type:
          - integer
          - 'null'
        expire_at:
          type:
          - integer
          - 'null'
        verified_at_client:
          type:
          - string
          - 'null'
      required:
      - status
      - strategy
      - attempts
      - expire_at
    verification_saml:
      x-speakeasy-name-override: SAML
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
          - verification_saml
        status:
          type: string
          enum:
          - unverified
          - verified
          - failed
          - expired
          - transferable
        strategy:
          type: string
          enum:
          - saml
        external_verification_redirect_url:
          type:
          - string
          - 'null'
        error:
          type:
          - object
          - 'null'
          oneOf:
          - $ref: '#/components/schemas/ClerkError'
        expire_at:
          type:
          - integer
          - 'null'
        attempts:
          type:
          - integer
          - 'null'
        verified_at_client:
          type:
          - string
          - 'null'
      required:
      - status
      - strategy
      - attempts
    ClerkError:
      type: object
      properties:
        message:
          type: string
        long_message:
          type: string
        code:
          type: string
        meta:
          type: object
          additionalProperties: true
      required:
      - message
      - long_message
      - code
    ClerkErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ClerkError'
        meta:
          type: object
          additionalProperties: true
        clerk_trace_id:
          type: string
      required:
      - errors
    DeletedObject:
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
        id:
          type: string
        slug:
          type: string
        deleted:
          type: boolean
        external_id:
          type: string
      required:
      - object
      - deleted
    verification_from_oauth:
      x-speakeasy-name-override: FromOAuth
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
          - verification_from_oauth
        status:
          type: string
          enum:
          - unverified
          - verified
        strategy:
          type: string
          pattern: ^from_oauth_(?:(?:token_)|(?:custom_))?[a-z]+$
        error:
          type:
          - object
          - 'null'
          oneOf:
          - $ref: '#/components/schemas/ClerkError'
        expire_at:
          type:
          - integer
          - 'null'
        attempts:
          type:
          - integer
          - 'null'
        verified_at_client:
          type:
          - string
          - 'null'
      required:
      - status
      - strategy
      - attempts
      - expire_at
    EmailAddress:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        object:
          type: string
          x-speakeasy-unknown-values: allow
          description: 'String representing the object''s type. Objects of the same type share the same value.

            '
          enum:
          - email_address
        email_address:
          type: string
        reserved:
          type: boolean
        verification:
          type:
          - object
          - 'null'
          oneOf:
          - $ref: '#/components/schemas/verification_otp'
          - $ref: '#/components/schemas/verification_admin'
          - $ref: '#/components/schemas/verification_from_oauth'
          - $ref: '#/components/schemas/verification_ticket'
          - $ref: '#/components/schemas/verification_saml'
          - $ref: '#/components/schemas/verification_email_link'
          - $ref: '#/components/schemas/verification_scim'
          discriminator:
            propertyName: object
            mapping:
              verification_otp: '#/components/schemas/verification_otp'
              verification_admin: '#/components/schemas/verification_admin'
              verification_from_oauth: '#/components/schemas/verification_from_oauth'
              verification_ticket: '#/components/schemas/verification_ticket'
              verification_saml: '#/components/schemas/verification_saml'
              verification_email_link: '#/components/schemas/verification_email_link'
              verification_scim: '#/components/schemas/verification_scim'
        linked_to:
          type: array
          items:
            $ref: '#/components/schemas/IdentificationLink'
        matches_sso_connection:
          description: 'Indicates whether this email address domain matches an active enterprise connection.

            '
          type: boolean
        created_at:
          type: integer
          format: int64
          description: 'Unix timestamp of creation

            '
        updated_at:
          type: integer
          format: int64
          description: 'Unix timestamp of creation

            '
      required:
      - object
      - email_address
      - verification
      - linked_to
      - reserved
      - created_at
      - updated_at
    verification_scim:
      x-speakeasy-name-override: SCIM
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
          - verification_scim
        status:
          type: string
          enum:
          - verified
        strategy:
          type: string
          enum:
          - scim
        attempts:
          type:
          - integer
          - 'null'
        expire_at:
          type:
          - integer
          - 'null'
      required:
      - status
      - strategy
      - attempts
      - expire_at
    verification_ticket:
      x-speakeasy-name-override: Ticket
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
          - verification_ticket
        status:
          type: string
          enum:
          - unverified
          - verified
          - expired
        strategy:
          x-speakeasy-unknown-values: allow
          type: string
          enum:
          - ticket
        attempts:
          type:
          - integer
          - 'null'
        expire_at:
          type:
          - integer
          - 'null'
        verified_at_client:
          type:
          - string
          - 'null'
      required:
      - status
      - strategy
      - attempts
      - expire_at
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Secret key, obtained under "API Keys" in the Clerk Dashboard.
      bearerFormat: sk_<environment>_<secret value>
externalDocs:
  url: https://clerk.com/docs
x-speakeasy-retries:
  strategy: backoff
  backoff:
    initialInterval: 500
    maxInterval: 60000
    maxElapsedTime: 3600000
    exponent: 1.5
  statusCodes:
  - 5XX
  retryConnectionErrors: true
x-provenance:
  method: harvested
  publisher: Clerk
  source: https://clerk.com/docs/reference/spec/bapi/latest.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
